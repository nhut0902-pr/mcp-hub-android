name: APK release



on:

  push:
  
    tags: ["v*"]
    
  workflow_dispatch:
  
    inputs:
    
      tag:
      
        description: Release tag
        
        required: false
        
        default: v1.0.1
        


permissions:

  contents: write
  


jobs:

  build:
  
    runs-on: ubuntu-latest
    
    timeout-minutes: 45
    
    steps:
    
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
      
        with:
        
          node-version: 22
          
      - run: corepack enable && corepack prepare pnpm@9.12.0 --activate
      
      - uses: actions/setup-java@v4
      
        with:
        
          distribution: temurin
          
          java-version: "17"
          
      - run: pnpm install --frozen-lockfile
      
      - run: npx expo prebuild --platform android --no-install --clean
      
      - name: Build standalone release APK with embedded JavaScript bundle
      
        run: ./gradlew app:assembleRelease --no-daemon
        
        working-directory: android
        
      - name: Prepare release artifact
      
        run: mv android/app/build/outputs/apk/release/app-release.apk MCP-Hub-${{ github.event.inputs.tag || github.ref_name }}.apk
        
      - uses: actions/upload-artifact@v4
      
        with:
        
          name: MCP-Hub-APK
          
          path: MCP-Hub-*.apk
          
      - uses: softprops/action-gh-release@v2
      
        with:
        
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          
          name: MCP Hub ${{ github.event.inputs.tag || github.ref_name }}
          
          generate_release_notes: true
          
          files: MCP-Hub-*.apk
          







































